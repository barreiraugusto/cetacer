# Proxy inverso. Copiar a /etc/nginx/sites-available/cetacer y enlazar en
# sites-enabled. Los estáticos los sirve whitenoise desde la propia aplicación;
# nginx sólo se encarga de /media/, que whitenoise no cubre.
#
# El TLS lo agrega certbot --nginx -d cetacer.com -d www.cetacer.com, que
# edita la copia instalada (bloque 443 y redirección desde el 80). Con eso,
# DJANGO_HTTPS=True en /srv/cetacer/.env.

upstream cetacer_app {
    server unix:/run/cetacer/gunicorn.sock fail_timeout=0;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name cetacer.com www.cetacer.com;

    # Los adjuntos que se suben desde el panel pueden ser grandes.
    client_max_body_size 20M;

    access_log /var/log/nginx/cetacer.access.log;
    error_log  /var/log/nginx/cetacer.error.log;

    location /media/ {
        alias /srv/cetacer/app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://cetacer_app;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
